[workspace]
members = ["crates/core", "apps/native", "apps/worker"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
anyhow = "1.0.99"
axum = "0.8.9"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde"] }
redis = { version = "1.5.0", default-features = false, features = ["connection-manager", "tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
sqlx = { version = "0.9.0", default-features = false, features = ["chrono", "derive", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
thiserror = "2.0.12"
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5.2"
tower-http = { version = "0.7.0", features = ["sensitive-headers", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "json"] }
uuid = { version = "1.16.0", features = ["js", "serde", "v4"] }
wasm-bindgen = "0.2.100"
worker = { version = "0.8.1", features = ["d1"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
