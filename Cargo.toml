[workspace]
members = ["crates/core", "apps/worker"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
argon2 = { version = "0.5.3", default-features = false, features = ["alloc", "password-hash"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.8"
thiserror = "2.0.12"
uuid = { version = "1.16.0", features = ["js", "serde", "v4"] }
wasm-bindgen = "0.2.100"
worker = { version = "0.8.1", features = ["d1"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

