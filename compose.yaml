services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: forum
      POSTGRES_PASSWORD: forum
      POSTGRES_USER: forum
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum -d forum"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  app:
    build:
      context: .
      dockerfile: apps/native/Dockerfile
    environment:
      DATABASE_URL: postgres://forum:forum@postgres:5432/forum
      LISTEN_ADDR: 0.0.0.0:3000
      REDIS_URL: redis://redis:6379
      RUST_LOG: forum_native=info,tower_http=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  redis-data:
